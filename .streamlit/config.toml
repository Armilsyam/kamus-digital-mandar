[theme]
# Warna tombol dan elemen utama (Biru Maritim elegan)
primaryColor = "#2563EB"

# Warna latar belakang utama aplikasi (Putih bersih)
backgroundColor = "#FFFFFF"

# Warna latar belakang sidebar (Abu-abu kebiruan sangat muda)
